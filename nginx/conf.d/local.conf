# Local/dev HTTP-only nginx config (no SSL required)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream beyondacademic_backend {
    server backend:8000 fail_timeout=0;
}

upstream beyondacademic_frontend {
    server frontend:80 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 50M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # API
    location /api {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://beyondacademic_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API docs
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://beyondacademic_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check
    location /health {
        proxy_pass http://beyondacademic_backend;
        access_log off;
    }

    # Frontend (SPA)
    location / {
        proxy_pass http://beyondacademic_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
