# Local development / one-click local deployment (HTTP, no SSL required)
services:
  db:
    image: postgres:15-alpine
    container_name: beyondacademic_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: beyondacademic
      POSTGRES_USER: beyondacademic_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    networks:
      - beyondacademic_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beyondacademic_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: beyondacademic_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - beyondacademic_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: beyondacademic_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://beyondacademic_user:${DB_PASSWORD:-devpassword123}@db:5432/beyondacademic
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-32chars}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENVIRONMENT: development
      ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://127.0.0.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beyondacademic_network
    volumes:
      - ./backend/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beyondacademic_frontend
    restart: unless-stopped
    networks:
      - beyondacademic_network

  nginx:
    image: nginx:alpine
    container_name: beyondacademic_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - beyondacademic_network

volumes:
  postgres_data:
  redis_data:

networks:
  beyondacademic_network:
    driver: bridge
